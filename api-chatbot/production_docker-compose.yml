version: '3.8'

# ============================================================
# CHATBOT TUYỂN SINH ĐH VINH — Production Docker Compose
# Khởi chạy: docker-compose -f production_docker-compose.yml up -d
# ============================================================

services:

  # ----------------------------------------------------------
  # Qdrant — Vector Database (Production config)
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot_qdrant_prod
    restart: always # Tự động restart khi crash hoặc reboot máy chủ
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data_prod:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: WARN # Giảm mức log để tiết kiệm I/O
    deploy:
      resources:
        limits:
          memory: 4G # Giới hạn bộ nhớ tránh OOM (Out of Memory)

  # ----------------------------------------------------------
  # Redis 7 — Session Store & Cache
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis_prod
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------
  # PostgreSQL 16 — LLM Config & Admin Database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chatbot_postgres_prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      # Mật khẩu nên được nạp từ biến môi trường của host
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretProdPass!123}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # FastAPI Backend — Production Workers
  # ----------------------------------------------------------
  backend:
    build: 
      context: .
      dockerfile: production_Dockerfile
    container_name: chatbot_backend_prod
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # KHÔNG bind mount toàn bộ thư mục gốc vào container nữa.
      # Chỉ mount duy nhất thư mục nhận file upload để lưu trữ persistent
      - uploads_data_prod:/app/data/uploads 
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      REDIS_URL: redis://redis:6379
      ENV: production
      DATABASE_URL: postgresql+asyncpg://chatbot_user:${POSTGRES_PASSWORD:-SuperSecretProdPass!123}@postgres:5432/chatbot_db
    # Command khởi chạy đã được thiết lập ở production_Dockerfile (Gunicorn)
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'   # Ràng buộc container sử dụng tối đa 4 core CPU
          memory: 4G  # Giới hạn RAM tránh việc memory leak của Python giết cả Server



volumes:
  qdrant_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  postgres_data_prod:
    driver: local
  uploads_data_prod:
    driver: local
