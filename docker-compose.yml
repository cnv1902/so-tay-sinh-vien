# ============================================================
# CẤU HÌNH DOCKER TOÀN DIỆN (FULL STACK)
# - Backend (FastAPI - Hệ thống & Admin API): Port 8000
# - Chatbot API (FastAPI - RAG & Trợ lý ảo): Port 8001
# - Qdrant Vector DB: Port 6333 / 6334
# - Redis Cache & Session: Port 6379
# - PostgreSQL Database: Port 5432
#
# Khởi chạy: docker compose up -d --build
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Qdrant Vector Database (Lưu trữ Embedding RAG & Chatbot)
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    networks:
      - vinhuni_net

  # ----------------------------------------------------------
  # 2. Redis Cache (Session Chatbot & Cache dữ liệu)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vinhuni_net

  # ----------------------------------------------------------
  # 3. PostgreSQL Database (Dữ liệu Hệ thống: Tin tức, Phòng ban, Cẩm nang...)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chatbot_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vinhuni_net

  # ----------------------------------------------------------
  # 4. API Chatbot (RAG, Gemini, LangChain, Qdrant) — Port 8001
  # ----------------------------------------------------------
  api-chatbot:
    build:
      context: ./api-chatbot
      dockerfile: Dockerfile
    container_name: chatbot_api
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./api-chatbot/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://chatbot_user:${POSTGRES_PASSWORD:-chatbot_pass}@postgres:5432/chatbot_db
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://localhost:8001,https://backend.covit.site,https://chatbot.covit.site
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - vinhuni_net

  # ----------------------------------------------------------
  # 5. Backend (Hệ thống, Bản đồ, Tin tức, Tuyển sinh, Quản trị) — Port 8000
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vinhuni_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://chatbot_user:${POSTGRES_PASSWORD:-chatbot_pass}@postgres:5432/chatbot_db
      REDIS_URL: redis://redis:6379
      LLM_SERVICE_URL: http://api-chatbot:8001
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://localhost:8001,https://backend.covit.site,https://chatbot.covit.site
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-chatbot:
        condition: service_started
    networks:
      - vinhuni_net

# KHAI BÁO VOLUME DỮ LIỆU
volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  vinhuni_net:
    driver: bridge
