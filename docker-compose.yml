# ============================================================
# CẤU HÌNH DOCKER DATABASE & INFRASTRUCTURE (LOCAL DEV)
# Chỉ chạy: PostgreSQL (5432), Redis (6379), Qdrant Vector DB (6333)
# Khởi chạy: docker compose up -d
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Qdrant Vector Database (Lưu trữ Embedding RAG & Chatbot)
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    networks:
      - vinhuni_net

  # ----------------------------------------------------------
  # 2. Redis Cache (Session Chatbot & Cache dữ liệu)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vinhuni_net

  # ----------------------------------------------------------
  # 3. PostgreSQL Database (Dữ liệu Hệ thống: Tin tức, Phòng ban, Cẩm nang...)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chatbot_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vinhuni_net

# KHAI BÁO VOLUME DỮ LIỆU (Bảo toàn 100% dữ liệu đã có)
volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  vinhuni_net:
    driver: bridge
